name: LTS Health v2 Nutrition History Smoke
on:
  push:
    branches: [architecture-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nutrition-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/nutrition-screen.js
          node --check v2/nutrition-history-smoke.mjs
          grep -q "sem registros disponíveis" v2/src/nutrition-screen.js
          grep -q "Nenhum dia importado neste ano" v2/src/nutrition-screen.js
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Test nutrition history
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/nutrition-history-smoke.mjs
