name: LTS Health v2 Bio Comparison Smoke
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/bio-screen.js'
      - 'v2/src/main.js'
      - 'v2/bio.css'
      - 'v2/bio-comparison-smoke.mjs'
      - '.github/workflows/bio-comparison-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bio-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/bio-screen.js
          node --check v2/src/main.js
          node --check v2/bio-comparison-smoke.mjs
          grep -q 'compareA' v2/src/bio-screen.js
          grep -q 'compareB' v2/src/bio-screen.js
          grep -q 'ordem invertida' v2/src/bio-screen.js
          ! grep -R 'MutationObserver' v2/src v2/index.html
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Bio comparison desktop and mobile
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/bio-comparison-smoke.mjs
