name: LTS Health v2 Today Body Source Smoke
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/today-screen.js'
      - 'v2/src/integrated-analysis.js'
      - 'v2/src/core.js'
      - 'v2/today-body-source-smoke.mjs'
      - '.github/workflows/today-body-source-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  today-body-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/today-screen.js
          node --check v2/src/integrated-analysis.js
          node --check v2/today-body-source-smoke.mjs
          grep -q 'latestOverall:latestBody' v2/src/today-screen.js
          grep -q 'Sem comparação entre origens diferentes' v2/src/today-screen.js
          ! grep -R 'MutationObserver' v2/src v2/index.html
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Today body source desktop and mobile
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/today-body-source-smoke.mjs
