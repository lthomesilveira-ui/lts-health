name: LTS Health iOS signing contract

on:
  push:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/ios-healthkit-sign.yml'
      - '.github/workflows/ios-healthkit-build.yml'
      - '.github/workflows/ios-signing-contract.yml'
      - 'ios/LTSHealthSync/**'
  pull_request:
    branches: [architecture-v2]
    paths:
      - '.github/workflows/ios-healthkit-sign.yml'
      - '.github/workflows/ios-healthkit-build.yml'
      - '.github/workflows/ios-signing-contract.yml'
      - 'ios/LTSHealthSync/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HealthKit and manual signing pipeline
        run: |
          node --check ios/LTSHealthSync/healthkit-contract-smoke.mjs
          node --check ios/LTSHealthSync/signing-contract-smoke.mjs
          node ios/LTSHealthSync/healthkit-contract-smoke.mjs
          node ios/LTSHealthSync/signing-contract-smoke.mjs
