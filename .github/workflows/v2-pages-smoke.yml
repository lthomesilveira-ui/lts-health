name: LTS Health v2 Pages Smoke

on:
  workflow_run:
    workflows: ["Deploy LTS Health"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public fallback and isolated v2 candidate
        run: |
          set -euo pipefail
          ROOT="https://lthomesilveira-ui.github.io/lts-health/"
          V2="https://lthomesilveira-ui.github.io/lts-health/v2/"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "$ROOT" -o "$TMP/root.html"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "$V2" -o "$TMP/v2.html"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "$V2/src/main.js" -o "$TMP/main.js"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "$V2/src/data-layer.js" -o "$TMP/data-layer.js"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "$V2/src/core.js" -o "$TMP/core.js"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "$V2/src/today-screen.js" -o "$TMP/today.js"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "$V2/src/data-screen.js" -o "$TMP/data.js"

          grep -q 'canonical v16' "$TMP/root.html"
          grep -q './product.js?v=29' "$TMP/root.html"
          ! grep -q 'type="module" src="./src/main.js"' "$TMP/root.html"

          grep -q 'Seu histórico de saúde em um só lugar' "$TMP/v2.html"
          grep -q 'type="module" src="./src/main.js"' "$TMP/v2.html"
          grep -q './evolution.css' "$TMP/v2.html"
          grep -q './data.css' "$TMP/v2.html"
          grep -q 'renderTrainingScreen' "$TMP/main.js"
          grep -q 'health_ingestion_previews' "$TMP/data-layer.js"
          grep -q "inspectFunction: 'health-inspect-upload'" "$TMP/core.js"
          grep -q "appleInspectFunction: 'health-inspect-upload-v2'" "$TMP/core.js"
          grep -q "labInspectFunction: 'health-inspect-lab'" "$TMP/core.js"
          grep -q "\['fleury','einstein','lab'\].includes(sourceType)" "$TMP/core.js"
          grep -q 'resting_heart_rate_bpm' "$TMP/today.js"
          grep -q 'CSV estruturado + documento preservado' "$TMP/data.js"
          grep -q 'Resultados textuais permanecem textuais' "$TMP/data.js"
      - name: Install deployed-browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Exercise deployed v2 on desktop and mobile
        env:
          LTS_HEALTH_BASE_URL: https://lthomesilveira-ui.github.io/lts-health/v2/?fixture=1
        run: node v2/live-smoke.mjs
