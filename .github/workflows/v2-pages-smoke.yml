name: LTS Health v2 Pages Smoke
on:
  workflow_run:
    workflows: ['Deploy LTS Health']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify promoted root, legacy fallback, active production graph and deployed bytes
        env:
          LTS_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ROOT='https://lthomesilveira-ui.github.io/lts-health/'
          LEGACY='https://lthomesilveira-ui.github.io/lts-health/legacy.html'
          V2='https://lthomesilveira-ui.github.io/lts-health/v2/'
          Q="lts_sha=${LTS_DEPLOY_SHA}&attempt=${GITHUB_RUN_ATTEMPT}"
          TMP="$(mktemp -d)"; trap 'rm -rf "$TMP"' EXIT
          fetch(){ local url="$1" out="$2" sep='?'; [[ "$url" == *\?* ]] && sep='&'; curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL "${url}${sep}${Q}" -o "$out"; }
          req(){ grep -Fq -- "$2" "$3" || { echo "::error::$1 missing"; exit 1; }; }
          same(){ cmp -s "$2" "$3" || { echo "::error::$1 differs from the checked-out deployment commit"; exit 1; }; }
          fetch "$ROOT" "$TMP/root.html"; fetch "$LEGACY" "$TMP/legacy.html"; fetch "$V2" "$TMP/v2.html"
          req root-promotion './v2/' "$TMP/root.html"
          req root-loading-copy 'Abrindo LTS Health' "$TMP/root.html"
          req legacy-fallback 'canonical v16' "$TMP/legacy.html"
          same root "$TMP/root.html" index.html
          same legacy "$TMP/legacy.html" legacy.html
          same v2-entry "$TMP/v2.html" v2/index.html
          node v2/production-integration-contract.mjs
          node v2/deployed-runtime-assets.mjs
          req v2-current-dashboard-css './health-dashboard.css' "$TMP/v2.html"
          req v2-title '<title>LTS Health</title>' "$TMP/v2.html"
          req v2-cockpit-css './cockpit.css' "$TMP/v2.html"
          req v2-dashboard-css './today.css' "$TMP/v2.html"
          req v2-analysis-css './analysis.css' "$TMP/v2.html"
          req v2-bio-css './bio.css' "$TMP/v2.html"
          for f in src/main.js src/data-layer.js src/core.js src/source-status.js src/data-screen.js src/today-screen.js src/integrated-analysis.js src/analysis-screen.js src/bio-screen.js cockpit.css today.css analysis.css bio.css product-finish.css dashboard-pixel-parity.css dashboard-final-polish.css ux-coherence.css src/dashboard-reference-runtime.js; do fetch "$V2/$f" "$TMP/$(basename "$f")-$(echo "$f"|tr '/' '_')"; same "$f" "$TMP/$(basename "$f")-$(echo "$f"|tr '/' '_')" "v2/$f"; done
          node v2/deployed-runtime-assets.mjs --list > "$TMP/active-runtime.txt"
          while IFS=$'\t' read -r f request; do fetch "$V2/$request" "$TMP/current-$(echo "$f"|tr '/' '_')"; same "$f" "$TMP/current-$(echo "$f"|tr '/' '_')" "v2/$f"; done < "$TMP/active-runtime.txt"
          req current-dashboard-owner 'data-health-dashboard' "$TMP/current-src_health-dashboard.js"
          req current-dashboard-insights 'O que mudou nos registros' "$TMP/current-src_health-dashboard.js"
          req current-source-boundary 'Origens separadas não são somadas' "$TMP/current-src_health-dashboard.js"
          # Retained byte/copy checks below describe supplemental legacy fixture modules.
          req legacy-dashboard-owner 'buildIntegratedAnalysis' "$TMP/today-screen.js-src_today-screen.js"
          req dashboard-copy 'Visão geral da sua saúde' "$TMP/today-screen.js-src_today-screen.js"
          req dashboard-insight 'Resumo da janela' "$TMP/today-screen.js-src_today-screen.js"
          req dashboard-change 'O que mudou' "$TMP/today-screen.js-src_today-screen.js"
          req hydration-copy 'Sem dado de ingestão de água' "$TMP/today-screen.js-src_today-screen.js"
          req exams-copy 'Exames' "$TMP/today-screen.js-src_today-screen.js"
          req workout-boundary 'canonicalWorkouts' "$TMP/integrated-analysis.js-src_integrated-analysis.js"
          req lab-boundary 'comparableLabCount' "$TMP/integrated-analysis.js-src_integrated-analysis.js"
          req composition-scale 'bioChartY' "$TMP/bio-screen.js-src_bio-screen.js"
          req source-boundary "stableAppleMetricTypes=new Set(['active_energy_kcal','exercise_minutes','stand_hours'])" "$TMP/source-status.js-src_source-status.js"
          req data-inventory 'O que já está no seu histórico' "$TMP/data-screen.js-src_data-screen.js"
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify clean public entry stays signed out without accessing health data
        env:
          LTS_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node v2/deployed-public-auth-smoke.mjs
      - name: Supplemental legacy fixture root routing and visual regression
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              {label:'desktop-1536x864',viewport:{width:1536,height:864}},
              {label:'mobile-390x844',viewport:{width:390,height:844}}
            ];
            for(const item of cases){
              const page=await browser.newPage({viewport:item.viewport});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
              await page.goto('https://lthomesilveira-ui.github.io/lts-health/?fixture=1',{waitUntil:'networkidle'});
              if(!page.url().includes('/lts-health/v2/')) throw new Error(`public root did not promote to /v2/: ${page.url()}`);
              const dashboard=page.locator('[data-executive-dashboard]');
              await dashboard.waitFor();
              await page.waitForFunction(()=>document.querySelector('.cockpitWelcome h1')?.textContent?.includes('Visão geral da sua saúde'));
              await page.waitForTimeout(250);
              const title=await dashboard.locator('h1').first().textContent();
              if(!String(title||'').includes('Visão geral da sua saúde')) throw new Error(`legacy fixture cockpit title missing: ${title}`);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
              if(overflow) throw new Error(`horizontal overflow at ${item.viewport.width}px`);
              if(errors.length) throw new Error(`${item.label}: browser errors ${errors.join(' | ')}`);
              await page.screenshot({path:`artifacts/deployed-public-dashboard-${item.label}.png`});
              await page.close();
            }
            await browser.close();
          })();
          NODE
      - name: Upload public signed-out and supplemental fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-dashboard-visual-evidence
          path: |
            artifacts/deployed-public-dashboard-*.png
            artifacts/deployed-public-login-*.png
            artifacts/public-entry-diagnostic-*.json
          if-no-files-found: error
          retention-days: 90
      - name: Supplemental deployed legacy fixture route regressions
        env:
          LTS_HEALTH_BASE_URL: https://lthomesilveira-ui.github.io/lts-health/v2/?fixture=1
        run: |
          node v2/homologation-live-smoke.mjs
          node v2/executive-dashboard-smoke.mjs
          node v2/product-finish-smoke.mjs
          LTS_HEALTH_UX_OUTPUT=artifacts/deployed-ux-coherence node v2/ux-coherence-browser-smoke.mjs
          node v2/upload-outcome-smoke.mjs
