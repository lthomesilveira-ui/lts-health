name: LTS Health v2 Homologation Pages Smoke
on:
  workflow_run:
    workflows: ['Deploy LTS Health']
    types: [completed]
permissions:
  contents: read
jobs:
  deployed-homologation:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Static checks
        run: |
          node --check v2/homologation-live-smoke.mjs
          grep -q 'Última medição' v2/src/bio-screen.js
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Exercise deployed desktop and mobile summaries
        run: node v2/homologation-live-smoke.mjs
