name: LTS Health static diagnostic
on:
  push:
    branches: [architecture-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modified-files-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace modified-file assertions
        run: |
          set -x
          node --check v2/src/source-status.js
          node --check v2/src/data-screen.js
          node --check v2/src/today-screen.js
          node --check v2/data-copy-smoke.mjs
          node --check v2/today-context-smoke.mjs
          grep -q "stableAppleMetricTypes" v2/src/source-status.js
          grep -q "active_energy_kcal" v2/src/source-status.js
          grep -q "exercise_minutes" v2/src/source-status.js
          grep -q "stand_hours" v2/src/source-status.js
          ! grep -q "stableAppleMetricTypes.*sleep_duration_h" v2/src/source-status.js
          ! grep -q "sourceMetrics.some(m=>norm(m.source_family)==='myfitnesspal')" v2/src/source-status.js
          ! grep -q "sourceMetrics.some(m=>norm(m.source_family)==='polar_flow')" v2/src/source-status.js
          grep -q "sourceStatusFor" v2/src/source-status.js
          grep -q "backupExportBtn" v2/src/data-screen.js
          grep -q "Automático canônico: energia ativa, minutos de exercício e horas em pé" v2/src/data-screen.js
          grep -q "Passos, FC de repouso, HRV, frequência respiratória, peso e sono podem chegar como candidatos" v2/src/data-screen.js
          grep -q "intervalos sobrepostos da mesma origem são unidos antes do total diário" v2/src/data-screen.js
          grep -q "fontes diferentes permanecem separadas" v2/src/data-screen.js
          grep -q "Calorias, proteína, carboidratos, gordura e fibra podem chegar pelo Apple Saúde" v2/src/data-screen.js
          grep -q "Arquivo preservado + revisão" v2/src/data-screen.js
          grep -q "Resultados só são estruturados quando a leitura for validada" v2/src/data-screen.js
          grep -q "sourceStatusFor('apple_health')" v2/src/data-screen.js
          grep -q "não verificado" v2/src/data-screen.js
          grep -q "Sincronização automática parcial" v2/src/data-screen.js
          grep -q "previewDetail" v2/src/data-screen.js
          grep -q "metricTypes" v2/src/today-screen.js
          grep -q "sleep_duration_h" v2/src/today-screen.js
          grep -q "sourceStatusFor('apple_health')" v2/src/today-screen.js
          grep -q "Arquivo recebido; dados ainda não confirmados" v2/src/today-screen.js
          grep -q "Progressão de treino" v2/src/today-screen.js
          grep -q "metricOrder" v2/src/today-screen.js
          grep -q "recentContext" v2/src/today-screen.js
          grep -q "sem transformar coincidências em causa ou meta" v2/src/today-screen.js
          grep -q "Energia ativa, minutos de exercício e horas em pé têm sincronização automática validada" v2/src/today-screen.js
          grep -q "Sono pode ser exibido quando já existe como métrica estruturada" v2/src/today-screen.js
