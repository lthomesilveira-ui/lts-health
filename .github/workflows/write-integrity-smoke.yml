name: LTS Health v2 Write Integrity Smoke
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/writes.js'
      - 'v2/src/entry.js'
      - 'v2/src/core.js'
      - 'v2/src/hydration.js'
      - 'v2/src/mfp-water-transfer.js'
      - 'v2/src/mfp-water-extractor.js'
      - 'v2/src/main.js'
      - 'v2/src/nutrition-screen.js'
      - 'v2/src/today-screen.js'
      - 'v2/src/data-screen.js'
      - 'v2/hydration-contract-test.mjs'
      - 'v2/mfp-water-transfer-test.mjs'
      - 'v2/mfp-water-import-smoke.mjs'
      - 'v2/mfp-water-extractor.html'
      - 'v2/mfp-water-extractor.css'
      - 'v2/water.css'
      - 'supabase/migrations/20260908100000_allow_user_confirmed_mfp_water.sql'
      - 'supabase/migrations/20260908223000_allow_authenticated_mfp_water_export.sql'
      - 'v2/write-integrity-smoke.mjs'
      - '.github/workflows/write-integrity-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  write-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/writes.js
          node --check v2/src/entry.js
          node --check v2/src/hydration.js
          node --check v2/src/mfp-water-transfer.js
          node --check v2/src/mfp-water-extractor.js
          node --check v2/write-integrity-smoke.mjs
          node --check v2/mfp-water-import-smoke.mjs
          node --check v2/mfp-water-transfer-test.mjs
          node v2/hydration-contract-test.mjs
          node v2/mfp-water-transfer-test.mjs
          grep -q 'negative_number_not_allowed' v2/src/writes.js
          grep -q 'localDateValue' v2/src/entry.js
          grep -q 'Use apenas valores iguais ou maiores que zero.' v2/src/entry.js
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Validate manual write rules
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/write-integrity-smoke.mjs
          node v2/mfp-water-import-smoke.mjs
