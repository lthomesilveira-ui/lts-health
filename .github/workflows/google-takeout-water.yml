name: LTS Health Google Takeout water
on:
  pull_request:
    branches: [main]
    paths: ['tools/google_takeout_water.py', 'tools/tests/test_google_takeout_water.py', 'supabase/migrations/**', 'supabase/tests/google-takeout-water-postgres-test.py', 'v2/src/hydration.js', 'v2/hydration-contract-test.mjs', 'v2/real-auth-e2e.mjs', 'v2/takeout-auth-boundary-test.mjs', '.github/workflows/google-takeout-water.yml']
  push:
    branches: [main]
    paths: ['tools/google_takeout_water.py', 'tools/tests/test_google_takeout_water.py', 'supabase/migrations/**', 'supabase/tests/google-takeout-water-postgres-test.py', 'v2/src/hydration.js', 'v2/hydration-contract-test.mjs', 'v2/real-auth-e2e.mjs', 'v2/takeout-auth-boundary-test.mjs', '.github/workflows/google-takeout-water.yml']
permissions:
  contents: read
jobs:
  takeout-water:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: takeout_water_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d takeout_water_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAKEOUT_WATER_SYNTHETIC_TEST: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: takeout_water_test
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify invented exports, source isolation, database boundaries and consumers
        run: |
          python3 -m unittest discover -s tools/tests -p test_google_takeout_water.py
          python3 supabase/tests/google-takeout-water-postgres-test.py
          node v2/hydration-contract-test.mjs
          node v2/takeout-auth-boundary-test.mjs
          node v2/production-integration-contract.mjs
          node v2/public-payload-guard.mjs
