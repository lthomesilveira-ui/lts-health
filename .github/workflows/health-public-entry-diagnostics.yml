name: LTS Health Public Entry Diagnostics
on:
  pull_request:
    paths: ['v2/public-entry-diagnostics*', 'v2/deployed-public-auth-smoke.mjs', '.github/workflows/health-public-entry-diagnostics.yml', '.github/workflows/v2-pages-smoke.yml', '.github/workflows/homologation-pages-smoke.yml', '.github/workflows/health-production-integration.yml']
  push:
    branches: [main]
    paths: ['v2/public-entry-diagnostics*', 'v2/deployed-public-auth-smoke.mjs', '.github/workflows/health-public-entry-diagnostics.yml', '.github/workflows/v2-pages-smoke.yml', '.github/workflows/homologation-pages-smoke.yml', '.github/workflows/health-production-integration.yml']
permissions:
  contents: read
concurrency:
  group: health-public-entry-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic-boundary:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify diagnostic privacy and syntax
        run: |
          node --check v2/deployed-public-auth-smoke.mjs
          node --check v2/public-entry-diagnostics-browser.mjs
          node v2/public-entry-diagnostics-test.mjs
          node v2/continuity-contract-smoke.mjs
          node v2/public-payload-guard.mjs
      - name: Install pinned browser API
        run: npm install --no-save playwright@1.56.1
      - name: Inject failures into isolated synthetic pages
        run: node v2/public-entry-diagnostics-browser.mjs
      - name: Keep synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-entry-diagnostic-regression
          path: artifacts/public-entry-regression/
          if-no-files-found: error
          retention-days: 7
