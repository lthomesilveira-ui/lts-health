name: cockpit-smoke
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/index.html'
      - 'v2/src/today-screen.js'
      - 'v2/src/home-reference.js'
      - 'v2/src/training-reference-v2.js'
      - 'v2/src/product-layout-runtime.js'
      - 'v2/src/main.js'
      - 'v2/src/core.js'
      - 'v2/src/timeline-screen.js'
      - 'v2/src/treatment-screen.js'
      - 'v2/src/analysis-screen.js'
      - 'v2/src/data-layer.js'
      - 'v2/home-reference.css'
      - 'v2/physical-iphone-remediation-20260915.css'
      - 'v2/training-reference-v2.css'
      - 'v2/public-audit-remediation.css'
      - 'v2/cockpit.css'
      - 'v2/analysis.css'
      - 'v2/secondary.css'
      - 'v2/shell-route-actions.css'
      - 'v2/product-delivery.css'
      - 'v2/cockpit-smoke.mjs'
      - 'v2/home-information-integrity-smoke.mjs'
      - 'v2/public-audit-contract-smoke.mjs'
      - 'v2/home-dashboard-reference-smoke.mjs'
      - 'v2/physical-iphone-layout-smoke.mjs'
      - '.github/workflows/cockpit-smoke.yml'
  pull_request:
    paths:
      - 'v2/index.html'
      - 'v2/src/today-screen.js'
      - 'v2/src/home-reference.js'
      - 'v2/src/training-reference-v2.js'
      - 'v2/src/product-layout-runtime.js'
      - 'v2/src/main.js'
      - 'v2/src/core.js'
      - 'v2/src/timeline-screen.js'
      - 'v2/src/treatment-screen.js'
      - 'v2/src/analysis-screen.js'
      - 'v2/src/data-layer.js'
      - 'v2/home-reference.css'
      - 'v2/physical-iphone-remediation-20260915.css'
      - 'v2/training-reference-v2.css'
      - 'v2/public-audit-remediation.css'
      - 'v2/cockpit.css'
      - 'v2/analysis.css'
      - 'v2/secondary.css'
      - 'v2/shell-route-actions.css'
      - 'v2/product-delivery.css'
      - 'v2/cockpit-smoke.mjs'
      - 'v2/home-information-integrity-smoke.mjs'
      - 'v2/public-audit-contract-smoke.mjs'
      - 'v2/home-dashboard-reference-smoke.mjs'
      - 'v2/physical-iphone-layout-smoke.mjs'
      - '.github/workflows/cockpit-smoke.yml'
  workflow_dispatch:
jobs:
  cockpit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Syntax checks
        run: |
          node --check v2/src/today-screen.js
          node --check v2/src/home-reference.js
          node --check v2/src/treatment-screen.js
          node --check v2/src/analysis-screen.js
          node --check v2/src/data-layer.js
          node --check v2/cockpit-smoke.mjs
          node --check v2/home-information-integrity-smoke.mjs
          node --check v2/public-audit-contract-smoke.mjs
          node --check v2/home-dashboard-reference-smoke.mjs
          node --check v2/physical-iphone-layout-smoke.mjs
          node v2/public-audit-contract-smoke.mjs
      - name: Start fixture server
        run: |
          cd v2
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/lts-health-cockpit-server.log 2>&1 &
      - name: Cockpit desktop and mobile
        run: node v2/cockpit-smoke.mjs
      - name: Home information integrity on mobile
        run: node v2/home-information-integrity-smoke.mjs
      - name: Approved Home dashboard on desktop and mobile
        run: node v2/home-dashboard-reference-smoke.mjs
      - name: Physical iPhone reduced-viewport layout
        run: node v2/physical-iphone-layout-smoke.mjs
      - name: Upload safe visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-audit-fixture-visuals
          path: v2/public-audit-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
