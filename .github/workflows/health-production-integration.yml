name: LTS Health Integrated Production
on:
  pull_request:
    paths: ['v2/**', 'preview/compact-evidence/**', 'tools/prepare-health-production.mjs', '.github/workflows/health-production-integration.yml']
  push:
    branches: [main]
    paths: ['v2/**', 'preview/compact-evidence/**', 'tools/prepare-health-production.mjs', '.github/workflows/health-production-integration.yml']
permissions:
  contents: read
jobs:
  integrated-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source parity, auth, privacy and bounded writes
        run: |
          node v2/production-integration-contract.mjs
          node v2/deployed-runtime-assets.mjs
          node --check v2/deployed-public-auth-smoke.mjs
          node preview/compact-evidence/tests/preview-contract.mjs
          node v2/privacy-contract-smoke.mjs
          node v2/production-write-boundary-test.mjs
          node v2/production-connection-boundary-test.mjs
          node v2/polar-contract-test.mjs
          node v2/source-current-coverage-test.mjs
          node v2/workout-estimate-provenance-test.mjs
      - name: Verify promoted analytical models using synthetic data
        run: |
          TESTDIR="$(mktemp -d v2/.integration-tests.XXXXXX)"
          trap 'rm -rf "$TESTDIR"' EXIT
          cp preview/compact-evidence/tests/* "$TESTDIR/"
          for test in health-data-quality health-cockpit composition-reading source-window-service source-window-selection lab-visual-context exercise-history-reading evolution-body-chart evolution-access lab-history-access care-nutrition-status dashboard-changes body-interval-model body-interval-view calendar-report-model calendar-report-view consumer-health-copy documentary-numeric-reading documentary-water-consumers documented-nutrition-plan documented-water-reference evidence-insights evolution-period-contract evolution-product final-evolution health-dashboard-body health-dashboard-context health-dashboard-empty-history health-dashboard-guidance health-dashboard-labs health-dashboard-model health-dashboard-render health-dashboard-training home-evidence-insights home-lab-history home-cockpit home-useful-render integrated-review lab-consumer-consistency lab-history-conflicts lab-shared-reading nutrition-archive nutrition-history-access nutrition-plan-comparison nutrition-plan-data nutrition-plan-view nutrition-reviewed-integration personal-goals-preservation steps-evidence training-comparability training-phase-label training-session-summary training-session-summary-view water-reference-consumers water-continuity; do
            node "$TESTDIR/${test}-test.mjs"
          done
      - name: Install pinned browser runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve integrated production and legacy-fixture test entry
        id: app_server
        run: |
          python3 -m http.server 4175 >/tmp/health-production.log 2>&1 &
          python3 -m http.server 4173 --directory v2 >/tmp/health-production-forms.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4175/v2/ >/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Verify actual renderer through mocked authentication, mobile routes and repeated cancel
        run: |
          node v2/production-integration-browser.mjs
          node v2/real-auth-dashboard-checks-test.mjs
          LTS_PUBLIC_ROOT=http://127.0.0.1:4175/ node v2/deployed-public-auth-smoke.mjs
          LTS_HEALTH_BASE_URL=http://127.0.0.1:4175/v2/ node preview/compact-evidence/tests/dashboard-changes-browser.mjs
      - name: Verify period-aware source selection and preserved daily cards
        if: ${{ !cancelled() && steps.app_server.outcome == 'success' }}
        run: LTS_HEALTH_BASE_URL=http://127.0.0.1:4175/v2/ node preview/compact-evidence/tests/source-window-browser.mjs
      - name: Verify compact period cards at exact mobile width
        if: ${{ !cancelled() && steps.app_server.outcome == 'success' }}
        run: LTS_HEALTH_BASE_URL=http://127.0.0.1:4175/v2/ node preview/compact-evidence/tests/period-readability-browser.mjs
      - name: Verify observed body and exercise history navigation
        if: ${{ !cancelled() && steps.app_server.outcome == 'success' }}
        run: LTS_HEALTH_BASE_URL=http://127.0.0.1:4175/v2/ node preview/compact-evidence/tests/evolution-access-browser.mjs
      - name: Verify discoverable laboratory search and history
        if: ${{ !cancelled() && steps.app_server.outcome == 'success' }}
        run: LTS_HEALTH_BASE_URL=http://127.0.0.1:4175/v2/ node preview/compact-evidence/tests/lab-history-access-browser.mjs
      - name: Verify readable laboratory scale and reference context
        if: ${{ !cancelled() && steps.app_server.outcome == 'success' }}
        env:
          LTS_HEALTH_BASE_URL: http://127.0.0.1:4175/v2/
        run: node preview/compact-evidence/tests/lab-visual-context-browser.mjs
      - name: Preserve existing input-validation and login-interruption tests
        run: |
          node v2/write-integrity-smoke.mjs
          node v2/auth-flow-smoke.mjs
      - name: Retain synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-production-synthetic-visual
          path: |
            artifacts/production-integration/*.png
            artifacts/deployed-public-login-*.png
            artifacts/public-entry-diagnostic-*.json
            dashboard-changes-visual/*.png
            source-window-visual/*
            period-readability-visual/*
            water-continuity-visual/*
            evolution-access-visual/*
            lab-history-access-visual/*
            lab-visual-context-evidence/*
          if-no-files-found: error
          retention-days: 7

