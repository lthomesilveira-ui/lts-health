name: LTS Health Executive Dashboard Smoke
on:
  pull_request:
    branches: [architecture-v2]
    paths: ['v2/src/integrated-analysis.js','v2/src/today-screen.js','v2/today.css','v2/cockpit.css','v2/executive-dashboard-smoke.mjs','.github/workflows/executive-dashboard-smoke.yml']
  push:
    branches: [architecture-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executive-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/integrated-analysis.js
          node --check v2/src/today-screen.js
          node --check v2/executive-dashboard-smoke.mjs
          grep -q 'buildIntegratedAnalysis' v2/src/today-screen.js
          grep -q 'Visão geral da sua saúde' v2/src/today-screen.js
          grep -q 'data-executive-dashboard' v2/src/today-screen.js
          grep -q 'canonicalWorkouts' v2/src/integrated-analysis.js
          grep -q 'comparableLoadUnit' v2/src/integrated-analysis.js
          grep -q 'Sem comparação entre origens diferentes' v2/src/today-screen.js
          grep -q 'Sem registro de ingestão de água' v2/src/today-screen.js
          ! grep -q 'buildHealthIntelligence' v2/src/today-screen.js
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Dashboard desktop mobile compact
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/executive-dashboard-smoke.mjs
