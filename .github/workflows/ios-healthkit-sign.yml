name: LTS Health iOS signed distribution

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload signed IPA to TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign-and-package:
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      LTS_BUNDLE_ID: com.ltshealth.sync
    steps:
      - uses: actions/checkout@v4

      - name: Verify required signing material
        shell: bash
        run: |
          set -euo pipefail
          required=(APPLE_TEAM_ID APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64)
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          if [[ "${{ inputs.upload_testflight }}" == "true" ]]; then
            test -n "${APP_STORE_CONNECT_KEY_ID:-}" || { echo "Missing APP_STORE_CONNECT_KEY_ID" >&2; exit 1; }
            test -n "${APP_STORE_CONNECT_ISSUER_ID:-}" || { echo "Missing APP_STORE_CONNECT_ISSUER_ID" >&2; exit 1; }
            test -n "${APP_STORE_CONNECT_PRIVATE_KEY_BASE64:-}" || { echo "Missing APP_STORE_CONNECT_PRIVATE_KEY_BASE64" >&2; exit 1; }
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LTSHealthSync
        run: xcodegen generate

      - name: Import signing certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/lts-health-signing.keychain-db"
          P12="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "runner" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "runner" "$KEYCHAIN"
          security import "$P12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "runner" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Apple Distribution'

      - name: Install and validate App Store provisioning profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/profile.plist"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$PLIST"
          python3 - "$PLIST" "$LTS_BUNDLE_ID" "$APPLE_TEAM_ID" <<'PY'
          import plistlib
          import sys
          from datetime import datetime, timezone

          path, bundle_id, team_id = sys.argv[1:]
          with open(path, 'rb') as handle:
              profile = plistlib.load(handle)

          entitlements = profile.get('Entitlements') or {}
          app_identifier = entitlements.get('application-identifier') or ''
          profile_team = entitlements.get('com.apple.developer.team-identifier') or ''
          expiration = profile.get('ExpirationDate')

          def fail(message):
              raise SystemExit(message)

          if not app_identifier.endswith('.' + bundle_id) or '*' in app_identifier:
              fail('Provisioning profile must use the explicit LTS Health App ID')
          if profile_team != team_id:
              fail('Provisioning profile team mismatch')
          if entitlements.get('com.apple.developer.healthkit') is not True:
              fail('Provisioning profile is missing HealthKit')
          if entitlements.get('com.apple.developer.healthkit.background-delivery') is not True:
              fail('Provisioning profile is missing HealthKit background delivery')
          if entitlements.get('get-task-allow', False) is not False:
              fail('Provisioning profile permits debugging and is not valid for App Store distribution')
          if profile.get('ProvisionedDevices'):
              fail('Provisioning profile contains registered devices and is not an App Store distribution profile')
          if profile.get('ProvisionsAllDevices') is True:
              fail('Provisioning profile is enterprise-wide and is not an App Store distribution profile')
          if not isinstance(expiration, datetime):
              fail('Provisioning profile expiration date missing')
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=timezone.utc)
          if expiration <= datetime.now(timezone.utc):
              fail('Provisioning profile is expired')
          if not profile.get('UUID') or not profile.get('Name'):
              fail('Provisioning profile identity metadata missing')
          PY
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Archive signed app
        working-directory: ios/LTSHealthSync
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          xcodebuild \
            -project LTSHealthSync.xcodeproj \
            -scheme LTSHealthSync \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LTSHealthSync.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.name }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Create export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${LTS_BUNDLE_ID}</key><string>${{ steps.profile.outputs.name }}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LTSHealthSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify signed IPA contract
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          CHECK_DIR="$RUNNER_TEMP/ipa-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$IPA" -d "$CHECK_DIR"
          APP=$(find "$CHECK_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          [[ "$BUNDLE" == "$LTS_BUNDLE_ID" ]] || { echo "Signed IPA bundle id mismatch" >&2; exit 1; }
          [[ "$BUILD" == "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" ]] || { echo "Signed IPA build number mismatch" >&2; exit 1; }
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/signed-entitlements.plist" 2>/dev/null
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' "$RUNNER_TEMP/signed-entitlements.plist")" == "true" ]] || { echo "Signed IPA missing HealthKit entitlement" >&2; exit 1; }
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit.background-delivery' "$RUNNER_TEMP/signed-entitlements.plist")" == "true" ]] || { echo "Signed IPA missing HealthKit background delivery entitlement" >&2; exit 1; }
          test -f "$APP/embedded.mobileprovision"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          EMBEDDED_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/embedded-profile.plist")
          [[ "$EMBEDDED_APP_ID" == *."$LTS_BUNDLE_ID" ]] || { echo "Embedded profile bundle id mismatch" >&2; exit 1; }

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LTSHealthSync-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Prepare App Store Connect API key
        if: ${{ inputs.upload_testflight }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Validate TestFlight package
        if: ${{ inputs.upload_testflight }}
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup signing material
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          security delete-keychain "$RUNNER_TEMP/lts-health-signing.keychain-db" >/dev/null 2>&1
