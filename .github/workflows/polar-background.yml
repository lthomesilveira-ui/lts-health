name: LTS Health Polar background
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  polar-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scheduler authentication and source boundaries
        run: |
          node --check supabase/functions/_shared/polar-schedule.mjs
          node --check supabase/functions/_shared/polar-runtime.mjs
          node --check v2/src/polar-connection.js
          node v2/polar-background-test.mjs
          node v2/polar-contract-test.mjs
          node v2/polar-provider-test.mjs
          node v2/health-auto-export-test.mjs
          node v2/continuity-contract-smoke.mjs
          node v2/public-payload-guard.mjs
