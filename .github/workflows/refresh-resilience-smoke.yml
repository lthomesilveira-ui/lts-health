name: LTS Health refresh resilience
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/data-layer.js'
      - 'v2/src/core.js'
      - 'v2/refresh-resilience-smoke.mjs'
      - '.github/workflows/refresh-resilience-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static resilience contract
        run: |
          node --check v2/src/data-layer.js
          node --check v2/refresh-resilience-smoke.mjs
          grep -q "Dados anteriores mantidos" v2/src/data-layer.js
          grep -q "Backup não criado" v2/src/data-layer.js
          ! grep -q "source_payload" <(grep "health_source_daily_metrics" v2/src/data-layer.js)
      - name: Refresh and backup resilience
        run: node v2/refresh-resilience-smoke.mjs