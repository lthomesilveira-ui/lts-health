name: LTS Health privacy contract
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/**'
      - 'v2/privacy-contract-smoke.mjs'
      - '.github/workflows/privacy-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cross-screen privacy contract
        run: |
          node --check v2/privacy-contract-smoke.mjs
          node v2/privacy-contract-smoke.mjs