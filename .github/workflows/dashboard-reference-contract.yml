name: LTS Health Dashboard Reference Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/dashboard-reference-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-architecture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical product contract
        run: |
          test -f v2/PRODUCT_ARCHITECTURE.md
          test -f v2/FEEDBACK_LEDGER.md
          test -f v2/REFERENCE_VISUAL_CONTRACT.md
          test -f v2/executive-shell.css
          test -f v2/cockpit.css
          test -f v2/UX_COHERENCE_CONTRACT.md
          test -f v2/ux-coherence.css
          node --check v2/src/today-screen.js
          node --check v2/src/main.js
          node --check v2/src/product-shell.js
          node v2/product-architecture-contract-smoke.mjs
          node v2/ux-coherence-contract-smoke.mjs

      - name: Reject superseded presentation layers
        run: |
          ! grep -q 'dashboard-parity.css' v2/index.html
          ! grep -q 'dashboard-reference-contract.css' v2/index.html
          ! grep -q 'executive-cockpit.js' v2/index.html
          ! grep -q 'dashboard-reference-runtime.js' v2/index.html
          ! grep -R "MutationObserver" v2/src v2/index.html
          grep -q 'executive-shell.css' v2/index.html
          grep -q 'cockpit.css' v2/index.html

      - name: Install browser runtime
        run: |
          npm init -y
          npm install --no-save playwright@1.58.2
          npx playwright install chromium

      - name: Start local application
        run: |
          python3 -m http.server 4173 --directory v2 > /tmp/lts-health-http.log 2>&1 &
          echo $! > /tmp/lts-health-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lts-health-http.log
          exit 1

      - name: Validate product hierarchy and responsive journeys
        run: |
          node v2/product-architecture-browser-smoke.mjs
          node v2/cockpit-smoke.mjs
          node v2/navigation-resilience-smoke.mjs
          node v2/product-architecture-visual-qa.mjs
          node v2/ux-coherence-browser-smoke.mjs

      - name: Upload visual inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-architecture-visual-qa
          path: artifacts/product-architecture
          if-no-files-found: warn
          retention-days: 14

      - name: Upload domain UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-coherence-visual-qa
          path: artifacts/ux-coherence
          if-no-files-found: warn
          retention-days: 14

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/lts-health-http.log || true
