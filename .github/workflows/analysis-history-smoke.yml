name: LTS Health v2 Analysis Smoke
on:
  push:
    branches: [architecture-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/integrated-analysis.js
          node --check v2/src/analysis-screen.js
          node --check v2/src/evidence-priority.js
          node --check v2/analysis-history-smoke.mjs
          node --check v2/analysis-period-consistency-smoke.mjs
          node --check v2/analysis-source-gap-smoke.mjs
          node --check v2/complementary-signals-smoke.mjs
          node --check v2/evidence-priority-smoke.mjs
          grep -q 'id="analysisPeriod"' v2/src/analysis-screen.js
          grep -q 'Mesma janela em toda esta seção' v2/src/analysis-screen.js
          grep -q 'Janela entre bioimpedâncias' v2/src/analysis-screen.js
          grep -q 'O que ainda limita a leitura' v2/src/analysis-screen.js
          grep -q 'Sinais complementares por origem' v2/src/analysis-screen.js
          grep -q 'O que mais limita esta leitura agora' v2/src/evidence-priority.js
          grep -q 'Separação de fontes preservada' v2/src/evidence-priority.js
          grep -q 'comparableLabCount' v2/src/integrated-analysis.js
          grep -q 'comparableLoadUnit' v2/src/integrated-analysis.js
          grep -q 'periodBounds' v2/src/integrated-analysis.js
          ! grep -Eiq '\b(readiness score|recovery score|ActivitySummary|count/min|MME)\b' v2/src/analysis-screen.js
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Test integrated analysis
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/analysis-history-smoke.mjs
          node v2/analysis-period-consistency-smoke.mjs
          node v2/analysis-source-gap-smoke.mjs
          node v2/complementary-signals-smoke.mjs
          node v2/evidence-priority-smoke.mjs
