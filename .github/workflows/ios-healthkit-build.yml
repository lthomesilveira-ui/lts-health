name: LTS Health iOS HealthKit build
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'ios/LTSHealthSync/**'
      - '.github/workflows/ios-healthkit-build.yml'
      - '.github/workflows/ios-healthkit-sign.yml'
  pull_request:
    branches: [architecture-v2]
    paths:
      - 'ios/LTSHealthSync/**'
      - '.github/workflows/ios-healthkit-build.yml'
      - '.github/workflows/ios-healthkit-sign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HealthKit, observability and signing contracts
        run: |
          node ios/LTSHealthSync/healthkit-contract-smoke.mjs
          node ios/LTSHealthSync/sync-observability-smoke.mjs
          node ios/LTSHealthSync/signing-contract-smoke.mjs

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/LTSHealthSync
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios/LTSHealthSync
        run: |
          xcodebuild \
            -project LTSHealthSync.xcodeproj \
            -scheme LTSHealthSync \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build for physical iPhone SDK
        working-directory: ios/LTSHealthSync
        run: |
          xcodebuild \
            -project LTSHealthSync.xcodeproj \
            -scheme LTSHealthSync \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive unsigned iPhone app
        working-directory: ios/LTSHealthSync
        run: |
          xcodebuild \
            -project LTSHealthSync.xcodeproj \
            -scheme LTSHealthSync \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/LTSHealthSync.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Package unsigned archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/LTSHealthSync.xcarchive" \
            "$RUNNER_TEMP/LTSHealthSync-unsigned.xcarchive.zip"
      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: LTSHealthSync-unsigned-xcarchive
          path: ${{ runner.temp }}/LTSHealthSync-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 14
