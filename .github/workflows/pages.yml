name: Deploy LTS Health

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 0; attempt < 8; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, per_page: 100
              });
              const matches = data.artifacts.filter(a => a.name === name && !a.expired && a.size_in_bytes > 0);
              if (matches.length > 1) throw new Error('Ambiguous Pages artifact');
              if (matches.length === 1) {
                // Let the Actions results index used by deploy-pages settle too.
                await new Promise(resolve => setTimeout(resolve, 4000));
                core.info('Current Pages artifact is visible');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('Current Pages artifact did not become visible');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
