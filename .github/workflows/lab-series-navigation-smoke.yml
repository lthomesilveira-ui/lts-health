name: LTS Health Lab Series Navigation Smoke
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/health-screen.js'
      - 'v2/health.css'
      - 'v2/lab-series-navigation-smoke.mjs'
      - '.github/workflows/lab-series-navigation-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab-series-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static gates
        run: |
          node --check v2/src/health-screen.js
          node --check v2/lab-series-navigation-smoke.mjs
          grep -q "Marcadores com série longitudinal" v2/src/health-screen.js
          grep -q "labHistoryYLabel" v2/src/health-screen.js
          grep -q "outra origem, outra unidade ou datas ambíguas" v2/src/health-screen.js
          ! grep -R 'MutationObserver\|loadAll\|activateTab' v2/src v2/index.html
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Desktop and mobile lab series smoke
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-lab-series.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/lab-series-navigation-smoke.mjs
          node v2/health-longitudinal-smoke.mjs
