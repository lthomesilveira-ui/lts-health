name: LTS Health data freshness smoke

on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/data-screen.js'
      - 'v2/src/data-layer.js'
      - 'v2/data-freshness-smoke.mjs'
      - '.github/workflows/data-freshness-smoke.yml'
  pull_request:
    branches: [architecture-v2]
    paths:
      - 'v2/src/data-screen.js'
      - 'v2/src/data-layer.js'
      - 'v2/data-freshness-smoke.mjs'
      - '.github/workflows/data-freshness-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/data-screen.js
          node --check v2/data-freshness-smoke.mjs
          grep -q 'dados até' v2/src/data-screen.js
          grep -q 'metric_date' v2/src/data-screen.js
          grep -q 'peso, volume de água e sono ficam separados até conferência' v2/src/data-screen.js
          grep -q 'Fontes diferentes de sono e hidratação continuam separadas' v2/src/data-screen.js
          ! grep -R 'MutationObserver' v2/src v2/index.html
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Freshness desktop mobile and failed-domain semantics
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/data-freshness-smoke.mjs
