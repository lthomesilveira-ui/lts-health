name: Source continuity hardening

on:
  push:
    branches: [architecture-v2]
    paths: ['.github/workflows/source-continuity-hardening.yml']

permissions:
  contents: write

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-v2
          fetch-depth: 0
      - name: Harden source continuity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v2/src/integrated-analysis.js')
          s=p.read_text()
          old="const knownSourceMismatch=(a,b)=>{const sa=sourceIdentity(a),sb=sourceIdentity(b);return Boolean(sa&&sb&&sa!==sb);};"
          new=old+"\nconst sourceContinuityBreak=(a,b)=>{const sa=sourceIdentity(a),sb=sourceIdentity(b);return Boolean((sa||sb)&&sa!==sb);};"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("if(knownSourceMismatch(ordered[i],ordered[i-1]))start=i;","if(sourceContinuityBreak(ordered[i],ordered[i-1]))start=i;",1)
          target="if(knownSourceMismatch(previous,latest))return{available:false,reason:'source_changed',rows,previous,latest,previousDay:pair.previousDay,latestDay:pair.latestDay};"
          assert s.count(target)>=2
          s=s.replace(target,target.replace('knownSourceMismatch','sourceContinuityBreak'),2)
          p.write_text(s)
          PY
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Add and run adversarial browser gate
        run: |
          cat > v2/source-continuity-unknown-smoke.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const viewport of [{width:1280,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            await page.goto('http://127.0.0.1:4173/?fixture=1#hoje',{waitUntil:'domcontentloaded'});
            const result=await page.evaluate(async()=>{
              const m=await import('./src/integrated-analysis.js');
              const ready={body:'ready',segmental:'ready',workouts:'ready',exercises:'ready',sets:'ready'};
              const body=[{measured_at:'2026-08-01',source_family:'inbody',weight_kg:80},{measured_at:'2026-08-15',weight_kg:79},{measured_at:'2026-09-01',source_family:'inbody',weight_kg:78}];
              const trend=m.bodyTrendModel({body},ready,12);
              const change=m.bodyChangeModel({body:body.slice(1)},ready);
              const segmental=[{measured_at:'2026-08-15',lean_trunk_kg:30},{measured_at:'2026-09-01',source_family:'inbody',lean_trunk_kg:31}];
              const seg=m.segmentalContextModel({segmental,workouts:[],exercises:[],sets:[]},ready);
              return{trendPoints:trend.points.length,trendReason:trend.reason,changeAvailable:change.available,changeReason:change.reason,segAvailable:seg.available,segReason:seg.reason};
            });
            if(result.trendPoints!==1||result.trendReason!=='source_changed'||result.changeAvailable!==false||result.changeReason!=='source_changed'||result.segAvailable!==false||result.segReason!=='source_changed')throw new Error(JSON.stringify(result));
            await page.close();
          }
          await browser.close();
          console.log('source continuity unknown smoke passed');
          EOF
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/source-continuity-unknown-smoke.mjs
          node v2/failure-smoke.mjs
          node v2/timeline-interaction-smoke.mjs
          node v2/nutrition-history-smoke.mjs
          node v2/analysis-history-smoke.mjs
          node v2/health-longitudinal-smoke.mjs
          node v2/training-progression-smoke.mjs
          node v2/bio-comparison-smoke.mjs
          node v2/evolution-comparison-smoke.mjs
      - name: Commit branch-only hardening
        run: |
          rm .github/workflows/source-continuity-hardening.yml
          git config user.name 'lts-health-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/src/integrated-analysis.js v2/source-continuity-unknown-smoke.mjs .github/workflows/source-continuity-hardening.yml
          git commit -m 'Harden body source continuity across unknown origins'
          git push origin HEAD:architecture-v2
