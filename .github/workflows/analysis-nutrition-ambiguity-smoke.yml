name: Analysis nutrition ambiguity smoke

on:
  push:
    branches: [architecture-v2]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/lts-health-v2.log 2>&1 &
      - run: node v2/analysis-nutrition-ambiguity-smoke.mjs
