name: LTS Health v2 Training Progression Smoke
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/**'
      - 'v2/*.css'
      - 'v2/training-progression-smoke.mjs'
      - '.github/workflows/training-progression-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/training-screen.js
          node --check v2/training-progression-smoke.mjs
          grep -q "exerciseSessionTrend" v2/src/training-screen.js
          grep -q "Sessões recentes" v2/src/training-screen.js
          grep -q "Unidades diferentes permanecem separadas" v2/src/training-screen.js
          ! grep -R 'loadAll' v2/src v2/index.html
          ! grep -R 'activateTab' v2/src v2/index.html
          ! grep -R 'MutationObserver' v2/src v2/index.html
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Training progression desktop and mobile
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/training-progression-smoke.mjs
