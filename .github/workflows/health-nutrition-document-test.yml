name: LTS Health synthetic nutrition document SQL
on:
  push:
    branches: [main]
    paths:
      - 'supabase/tests/nutrition-document-*.mjs'
      - 'supabase/tests/support/nutrition-plan-insert.mjs'
      - 'supabase/tests/support/nutrition-document-fixture.mjs'
      - 'supabase/tests/fixtures/nutrition-document-synthetic.sql'
      - 'supabase/tests/NUTRITION_DOCUMENT_TESTS.md'
      - 'preview/compact-evidence/src/documented-nutrition-plan.js'
      - '.github/workflows/health-nutrition-document-test.yml'
  pull_request:
    paths:
      - 'supabase/tests/nutrition-document-*.mjs'
      - 'supabase/tests/support/nutrition-plan-insert.mjs'
      - 'supabase/tests/support/nutrition-document-fixture.mjs'
      - 'supabase/tests/fixtures/nutrition-document-synthetic.sql'
      - 'supabase/tests/NUTRITION_DOCUMENT_TESTS.md'
      - 'preview/compact-evidence/src/documented-nutrition-plan.js'
      - '.github/workflows/health-nutrition-document-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-nutrition-document-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nutrition_document_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutrition_document_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NUTRITION_DOCUMENT_SYNTHETIC_TEST: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: nutrition_document_test
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Validate generic SQL builder with synthetic manifests
        run: |
          node --check supabase/tests/support/nutrition-plan-insert.mjs
          node --check supabase/tests/nutrition-document-postgres-test.mjs
          node --test supabase/tests/nutrition-document-builder-test.mjs
      - name: Compile and execute guarded inserts in isolated PostgreSQL 17
        run: node --test supabase/tests/nutrition-document-postgres-test.mjs
