name: LTS Health Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Dedicated backend guardrails
        run: |
          grep -q "plztdqyuqcjohiimudnr" config.js
          grep -q "health-inspect-upload-v2" config.js
          ! grep -R "tadhkamnwtsbdozwkyut" --exclude-dir=.git --exclude-dir=.github --include='*.js' --include='*.html' --include='*.css' --include='*.md' .
      - name: Consolidated product wiring
        run: |
          test -f product.js
          test -f product.css
          for m in training-product training-progression-deep evolution-product segmental-history today-product today-evidence timeline-product nutrition-product nutrition-analytics health-product health-longitudinal health-evidence-bundles inbox-operations insights-evidence search-product; do
            test -f "$m.js"
            test -f "$m.css"
            grep -q "$m.js" config.js
            grep -q "$m.js" sw.js
          done
          grep -q "lts-health-shell-product-v49" sw.js
          ! grep -q "app-v17.js" index.html
          ! grep -q "app-v17.js" sw.js
      - name: Provenance and safety contracts
        run: |
          grep -q "Fonte incompleta preservada" training-product.js
          grep -q "unidades nunca são misturadas" training-progression-deep.js
          grep -q "não classificam aparência" evolution-product.js
          grep -q "nenhuma estimativa" segmental-history.js
          grep -q "A · medição" segmental-history.js
          grep -q "B · referência" segmental-history.js
          grep -q "A − B" segmental-history.js
          grep -q "não interpreta a direção da mudança como melhor ou pior" segmental-history.js
          grep -q "campos ausentes permanecem ausentes" today-product.js
          grep -q "É cobertura de evidência, não meta" today-evidence.js
          grep -q "Não demonstra causa, efeito, recuperação ou prontidão" today-evidence.js
          grep -q "não reconstrói automaticamente dias sem dados" timeline-product.js
          grep -q "Ausência de registro significa ausência de evidência" nutrition-product.js
          grep -q "não demonstra causa" nutrition-analytics.js
          grep -q "Cobertura mede disponibilidade do export" nutrition-analytics.js
          grep -q "Um dia ausente não é interpretado como jejum" nutrition-analytics.js
          grep -q "campos ausentes não são estimados" nutrition-analytics.js
          grep -q "não transforma esses campos em diagnóstico" health-product.js
          grep -q "A · coleta" health-longitudinal.js
          grep -q "B · referência" health-longitudinal.js
          grep -q "A − B mostra somente" health-longitudinal.js
          grep -q "unidades diferentes" health-longitudinal.js
          grep -q "não substitui referência laboratorial" health-longitudinal.js
          grep -q "Correspondência temporal não significa causalidade" health-evidence-bundles.js
          grep -q "não prova que o documento pertence a esta coleta" health-evidence-bundles.js
          grep -q "não preenche documentos ausentes" health-evidence-bundles.js
          grep -q "nada é preenchido por estimativa" inbox-operations.js
          grep -q "Nenhum readiness/recovery score é calculado" insights-evidence.js
          grep -q "proveniência continua preservada" search-product.js
      - name: Search navigation contract
        run: |
          grep -q "BUSCA GLOBAL" search-product.js
          grep -q "data-sp-target" search-product.js
          grep -q "activateTab" search-product.js
          grep -q "metaKey" search-product.js
      - name: No private payload files
        run: |
          ! find . -type f \( -name '*.zip' -o -name '*.pdf' -o -name '*.csv' -o -name '*.json' \) -not -path './.git/*' | grep .
