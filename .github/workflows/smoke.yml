name: LTS Health Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check app-v8.js
          for n in 11 12 13 14 15 16; do node --check "app-v${n}.js"; done
          node --check product.js
          node --check training-product.js
          node --check evolution-product.js
          node --check segmental-history.js
          node --check today-product.js
          node --check nutrition-product.js
          node --check health-product.js
          node --check health-longitudinal.js
          node --check nutrition-analytics.js
          node --check inbox-operations.js
          node --check sw.js
          node --check config.js
      - name: Dedicated backend guardrails
        run: |
          grep -q "plztdqyuqcjohiimudnr" config.js
          grep -q "inspectFunction: 'health-inspect-upload-v2'" config.js
          ! grep -R "tadhkamnwtsbdozwkyut" --exclude-dir=.git --exclude=smoke.yml --include='*.js' --include='*.html' --include='*.css' --include='*.md' .
      - name: Consolidated product shell
        run: |
          test -f product.js
          test -f product.css
          for m in training evolution today nutrition health; do test -f "$m-product.js"; test -f "$m-product.css"; grep -q "$m-product.js" config.js; grep -q "$m-product.js" sw.js; done
          test -f segmental-history.js
          test -f segmental-history.css
          grep -q "segmental-history.js" config.js
          grep -q "segmental-history.js" sw.js
          test -f health-longitudinal.js
          test -f health-longitudinal.css
          grep -q "health-longitudinal.js" config.js
          grep -q "health-longitudinal.js" sw.js
          test -f nutrition-analytics.js
          test -f nutrition-analytics.css
          grep -q "nutrition-analytics.js" config.js
          grep -q "nutrition-analytics.js" sw.js
          test -f inbox-operations.js
          test -f inbox-operations.css
          grep -q "inbox-operations.js" config.js
          grep -q "inbox-operations.js" sw.js
          grep -q "product.css?v=29" index.html
          grep -q "product.js?v=29" index.html
          ! grep -q "app-v17.js" index.html
          ! grep -q "loadHealthLayer" config.js
          grep -q "lts-health-shell-product-v40" sw.js
          ! grep -q "app-v17.js" sw.js
      - name: Functional parity surfaces
        run: |
          grep -q "Análise longitudinal" product.js
          grep -q "Dados & Inbox" product.js
          grep -q "Exportar backup estruturado" product.js
          grep -q "Buscar no histórico" product.js
          grep -q "Fonte incompleta preservada" training-product.js
          grep -q "reps_raw" training-product.js
          grep -q "Séries por grupo" training-product.js
          grep -q "Evolução por exercício" training-product.js
          grep -q "Evidência da sessão" training-product.js
          grep -q "Última comparação observada" training-product.js
          grep -q "falha registrada" training-product.js
          grep -q "Série longitudinal" evolution-product.js
          grep -q "Comparar duas medições" evolution-product.js
          grep -q "Composição segmentar" evolution-product.js
          grep -q "Histórico de medições" evolution-product.js
          grep -q "Histórico segmentar detalhado" segmental-history.js
          grep -q "diferença direita − esquerda" segmental-history.js
          grep -q "Último treino registrado" today-product.js
          grep -q "Frescor das fontes" today-product.js
          grep -q "Pendências de evidência" today-product.js
          grep -q "fonte preservada" today-product.js
          grep -q "Cobertura por mês" nutrition-product.js
          grep -q "Refeições recentes" nutrition-product.js
          grep -q "health_nutrition_meals" nutrition-product.js
          grep -q "Leitura do histórico MyFitnessPal" nutrition-analytics.js
          grep -q "Contexto de treino" nutrition-analytics.js
          grep -q "Distribuição por dia da semana" nutrition-analytics.js
          grep -q "Histórico por biomarcador" health-product.js
          grep -q "Coleta completa" health-product.js
          grep -q "Documentos" health-product.js
          grep -q "Atividade & sono" health-product.js
          grep -q "Coleta versus coleta anterior" health-longitudinal.js
          grep -q "Mapa de documentos" health-longitudinal.js
          grep -q "par(es) retido(s) por unidade/valor não comparável" health-longitudinal.js
          grep -q "Inbox em uma visão" inbox-operations.js
          grep -q "Fila operacional" inbox-operations.js
          grep -q "Apple Health · contrato conservador" inbox-operations.js
          grep -q "Passos" inbox-operations.js
          grep -q "FC de repouso" inbox-operations.js
      - name: Safety and provenance guardrails
        run: |
          grep -q "não constituem diagnóstico" product.js
          grep -q "Associação não é causalidade" product.js
          grep -q "sem evidência" product.js
          grep -q "Arquivos binários privados do Inbox não estão embutidos" product.js
          grep -q "não meta de frequência" training-product.js
          grep -q "unidades permanecem separadas" training-product.js
          grep -q "não mede sozinho desempenho total" training-product.js
          grep -q "não classificam aparência" evolution-product.js
          grep -q "sem transformar diferença em julgamento corporal" evolution-product.js
          grep -q "não classificam aparência, saúde ou desempenho" segmental-history.js
          grep -q "nenhuma estimativa, alvo corporal ou score de simetria" segmental-history.js
          grep -q "campos ausentes permanecem ausentes" today-product.js
          grep -q "sem julgamento corporal" today-product.js
          grep -q "Ausência de registro significa ausência de evidência" nutrition-product.js
          grep -q "descrição, não meta" nutrition-product.js
          grep -q "não prescreve quantidade ou frequência" nutrition-product.js
          grep -q "não demonstra causa" nutrition-analytics.js
          grep -q "Nenhum alvo calórico, restrição ou julgamento corporal" nutrition-analytics.js
          grep -q "health_daily_nutrition + health_nutrition_meals" nutrition-analytics.js
          grep -q "não transforma esses campos em diagnóstico" health-product.js
          grep -q "Metadados de documento não provam" health-product.js
          grep -q "ausência de série não vira valor zero" health-product.js
          grep -q "não substituem referência laboratorial ou interpretação clínica" health-longitudinal.js
          grep -q "Ausência de documento ou status de extração não é interpretada" health-longitudinal.js
          grep -q "não são somados nem escolhidos arbitrariamente" inbox-operations.js
          grep -q "nada é preenchido por estimativa" inbox-operations.js
          grep -q "storage privado" inbox-operations.js
      - name: No private health payloads in repository
        run: |
          ! find . -type f \( -name '*.zip' -o -name '*.pdf' -o -name '*.csv' -o -name '*.json' \) -not -path './.git/*' | grep .
