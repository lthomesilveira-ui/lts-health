name: LTS Health Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check app-v8.js
          for n in 11 12 13 14 15 16; do node --check "app-v${n}.js"; done
          node --check product.js
          node --check training-product.js
          node --check evolution-product.js
          node --check today-product.js
          node --check sw.js
          node --check config.js
      - name: Dedicated backend guardrails
        run: |
          grep -q "plztdqyuqcjohiimudnr" config.js
          grep -q "inspectFunction: 'health-inspect-upload'" config.js
          ! grep -R "tadhkamnwtsbdozwkyut" --exclude-dir=.git --exclude=smoke.yml --include='*.js' --include='*.html' --include='*.css' --include='*.md' .
      - name: Consolidated product shell
        run: |
          test -f product.js
          test -f product.css
          test -f training-product.js
          test -f training-product.css
          test -f evolution-product.js
          test -f evolution-product.css
          test -f today-product.js
          test -f today-product.css
          grep -q "product.css?v=29" index.html
          grep -q "product.js?v=29" index.html
          ! grep -q "app-v17.js" index.html
          ! grep -q "loadHealthLayer" config.js
          grep -q "training-product.js" config.js
          grep -q "evolution-product.js" config.js
          grep -q "today-product.js" config.js
          grep -q "lts-health-shell-product-v32" sw.js
          grep -q "training-product.js" sw.js
          grep -q "evolution-product.js" sw.js
          grep -q "today-product.js" sw.js
          ! grep -q "app-v17.js" sw.js
      - name: Functional parity surfaces
        run: |
          grep -q "Histórico por biomarcador" product.js
          grep -q "Cobertura por mês" product.js
          grep -q "Análise longitudinal" product.js
          grep -q "Dados & Inbox" product.js
          grep -q "Exportar backup estruturado" product.js
          grep -q "Buscar no histórico" product.js
          grep -q "Fonte incompleta preservada" training-product.js
          grep -q "reps_raw" training-product.js
          grep -q "registro parcial" training-product.js
          grep -q "Séries por grupo" training-product.js
          grep -q "Evolução por exercício" training-product.js
          grep -q "Série longitudinal" evolution-product.js
          grep -q "Comparar duas medições" evolution-product.js
          grep -q "Composição segmentar" evolution-product.js
          grep -q "Histórico de medições" evolution-product.js
          grep -q "Último treino registrado" today-product.js
          grep -q "Frescor das fontes" today-product.js
          grep -q "Pendências de evidência" today-product.js
          grep -q "tdOpenTraining" today-product.js
      - name: Safety and provenance guardrails
        run: |
          grep -q "não constituem diagnóstico" product.js
          grep -q "Associação não é causalidade" product.js
          grep -q "sem evidência" product.js
          grep -q "Passos e frequência cardíaca de repouso ainda não são consolidados automaticamente" product.js
          grep -q "Arquivos binários privados do Inbox não estão embutidos" product.js
          grep -q "não meta de frequência" training-product.js
          grep -q "unidades permanecem separadas" training-product.js
          grep -q "não classificam aparência" evolution-product.js
          grep -q "sem transformar diferença em julgamento corporal" evolution-product.js
          grep -q "Notas livres da fonte ficam preservadas no banco" evolution-product.js
          grep -q "campos ausentes permanecem ausentes" today-product.js
          grep -q "sem julgamento corporal" today-product.js
      - name: No private health payloads in repository
        run: |
          ! find . -type f \( -name '*.zip' -o -name '*.pdf' -o -name '*.csv' -o -name '*.json' \) -not -path './.git/*' | grep .
