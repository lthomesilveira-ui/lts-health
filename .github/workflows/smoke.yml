name: LTS Health Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check app-v8.js
          node --check app-v11.js
          node --check app-v12.js
          node --check app-v13.js
          node --check sw.js
          node --check config.js
      - name: Dedicated backend guardrails
        run: |
          grep -q "plztdqyuqcjohiimudnr" config.js
          grep -q "health-inspect-upload-v2" config.js
          ! grep -R "tadhkamnwtsbdozwkyut" --exclude-dir=.git --exclude=smoke.yml --include='*.js' --include='*.html' --include='*.css' --include='*.md' .
      - name: Product layer references
        run: |
          test -f v10.css
          test -f v11.css
          test -f v12.css
          test -f v13.css
          test -f app-v11.js
          test -f app-v12.js
          test -f app-v13.js
          test -f manifest.webmanifest
          test -f sw.js
          grep -q "v13.css" config.js
          grep -q "app-v13.js" config.js
          grep -q "manifest.webmanifest" app-v13.js
          grep -q "supabase.co" sw.js
      - name: No private health payloads in repository
        run: |
          ! find . -type f \( -name '*.zip' -o -name '*.pdf' -o -name '*.csv' -o -name '*.json' \) -not -path './.git/*' | grep .
