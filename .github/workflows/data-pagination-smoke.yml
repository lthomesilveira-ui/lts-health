name: LTS Health v2 Data Pagination Smoke
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/data-layer.js'
      - 'v2/data-pagination-smoke.mjs'
      - '.github/workflows/data-pagination-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          node --check v2/src/data-layer.js
          node --check v2/data-pagination-smoke.mjs
          grep -q 'export async function fetchAll' v2/src/data-layer.js
          grep -q 'tieBreaker' v2/src/data-layer.js
          ! grep -q 'maxRows' v2/src/data-layer.js
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Exercise pagination beyond one thousand rows
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/data-pagination-smoke.mjs
