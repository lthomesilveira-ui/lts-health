name: LTS Health Visual Architecture Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the documented visual architecture
        run: node v2/product-architecture-contract-smoke.mjs

      - name: Install browser runtime
        run: |
          npm init -y
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Render canonical desktop and mobile views
        run: |
          python3 -m http.server 4173 --directory v2 > /tmp/lts-health-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node v2/product-architecture-browser-smoke.mjs
          node v2/product-architecture-visual-qa.mjs

      - name: Upload visual inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-architecture-visual-qa
          path: artifacts/product-architecture
          if-no-files-found: warn
          retention-days: 14
