name: LTS Health architecture v2

on:
  push:
    branches: [architecture-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static architecture and contract gates
        run: |
          set -euo pipefail
          for file in v2/src/*.js; do node --check "$file"; done
          for file in \
            v2/failure-smoke.mjs \
            v2/timeline-interaction-smoke.mjs \
            v2/nutrition-history-smoke.mjs \
            v2/analysis-history-smoke.mjs \
            v2/analysis-period-consistency-smoke.mjs \
            v2/evidence-priority-smoke.mjs \
            v2/health-longitudinal-smoke.mjs \
            v2/training-progression-smoke.mjs \
            v2/canonical-boundary-smoke.mjs \
            v2/source-status-smoke.mjs \
            v2/provenance-alias-smoke.mjs \
            v2/executive-dashboard-smoke.mjs \
            v2/cockpit-smoke.mjs \
            v2/product-finish-smoke.mjs \
            v2/upload-outcome-smoke.mjs \
            v2/mfp-water-import-smoke.mjs \
            v2/source-continuity-unknown-smoke.mjs; do node --check "$file"; done
          node --check v2/hydration-contract-test.mjs
          node --check v2/mfp-water-transfer-test.mjs
          node --check v2/continuity-contract-smoke.mjs
          node --check v2/public-payload-guard.mjs
          bash -n v2/run-browser-gate.sh
          node v2/hydration-contract-test.mjs
          node v2/mfp-water-transfer-test.mjs
          node v2/continuity-contract-smoke.mjs
          node v2/public-payload-guard.mjs

          test -f v2/index.html
          test -f v2/styles.css
          test -f v2/product-finish.css
          test -f v2/src/integrated-analysis.js
          test ! -f v2/app.js
          test ! -f v2/src/screens.js
          grep -q 'type="module" src="./src/main.js"' v2/index.html
          grep -q './product-finish.css' v2/index.html
          grep -q 'Seu cockpit longitudinal de saúde' v2/index.html
          grep -q 'data-route="bio">Composição<' v2/index.html
          grep -q 'data-route="analise">Insights<' v2/index.html
          grep -q 'data-route="saude">Exames<' v2/index.html
          grep -q 'data-route="tratamentos">Protocolos<' v2/index.html

          grep -q "https://plztdqyuqcjohiimudnr.supabase.co" v2/src/core.js
          grep -q "bucket: 'health-inbox'" v2/src/core.js
          grep -q "inspectFunction: 'health-inspect-upload'" v2/src/core.js
          grep -q "inspectFunctionForSource = () => CONFIG.inspectFunction" v2/src/core.js
          ! grep -q "health-inspect-upload-v2" v2/src/core.js
          ! grep -q "health-inspect-lab" v2/src/core.js
          grep -Fq "export const stableAppleMetricTypes=new Set(['active_energy_kcal','exercise_minutes','stand_hours']);" v2/src/source-status.js
          ! grep -q "stableAppleMetricTypes.*sleep_duration_h" v2/src/source-status.js
          grep -q "candidateFromFamily(sourceMetrics,'myfitnesspal')" v2/src/source-status.js
          grep -q "candidateFromFamily(sourceMetrics,'polar_flow')" v2/src/source-status.js
          grep -q "if(candidateFound)return'candidate'" v2/src/source-status.js
          grep -q "isAppleActivitySummarySource" v2/src/source-status.js
          grep -q "isMyFitnessPalViaApple" v2/src/source-status.js
          grep -q "visibleRowsForDomain" v2/src/data-layer.js
          grep -q "ensureRouteData" v2/src/data-layer.js
          grep -q "isRouteReady" v2/src/main.js
          grep -q "uploadOutcomeMessageFromState" v2/src/main.js
          grep -q "Importar água do MFP" v2/src/main.js
          grep -q "mfp_water_total_v1" v2/src/writes.js
          grep -q "mfp_authenticated_water_export_v1" v2/src/mfp-water-transfer.js
          grep -q "/food/water?date=" v2/src/mfp-water-extractor.js

          grep -q "buildIntegratedAnalysis" v2/src/today-screen.js
          grep -q "canonicalWorkouts" v2/src/integrated-analysis.js
          grep -q "comparableLoadUnit" v2/src/integrated-analysis.js
          grep -q "comparableLabCount" v2/src/integrated-analysis.js
          grep -q "sleepCoverageModel" v2/src/integrated-analysis.js
          grep -q "sourceContinuityBreak" v2/src/integrated-analysis.js
          grep -q "periodBounds" v2/src/integrated-analysis.js
          grep -q "nutritionPeriodModel" v2/src/integrated-analysis.js
          grep -q "Mesma janela para os sinais de maior frequência" v2/src/analysis-screen.js
          grep -q "Últimas duas medições comparáveis, independentemente da janela recente" v2/src/analysis-screen.js
          grep -q "O histórico não desaparece quando a janela recente não tem coleta" v2/src/analysis-screen.js
          grep -q "Água ingerida" v2/src/analysis-screen.js
          grep -q "Origens diferentes permanecem separadas" v2/src/analysis-screen.js
          grep -q "sem atribuir causa" v2/src/today-screen.js
          grep -q "Sem comparação entre origens diferentes" v2/src/today-screen.js
          grep -q "Sono permanece fora desta leitura" v2/src/intelligence-engine.js

          ! grep -R 'loadAll' v2/src v2/index.html
          ! grep -R 'activateTab' v2/src v2/index.html
          ! grep -R 'MutationObserver' v2/src v2/index.html
          ! grep -R 'tadhkamnwtsbdozwkyut' v2/src v2/index.html
          ! grep -Eq '[0-9]{4}-[0-9]{2}-[0-9]{2}' v2/DATA_AUDIT.md
          ! grep -Eq '[0-9]{4}-[0-9]{2}-[0-9]{2}' v2/PARITY_MATRIX.md

      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser gates desktop and mobile
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          for test_file in \
            v2/failure-smoke.mjs \
            v2/timeline-interaction-smoke.mjs \
            v2/nutrition-history-smoke.mjs \
            v2/analysis-history-smoke.mjs \
            v2/analysis-period-consistency-smoke.mjs \
            v2/evidence-priority-smoke.mjs \
            v2/health-longitudinal-smoke.mjs \
            v2/training-progression-smoke.mjs \
            v2/canonical-boundary-smoke.mjs \
            v2/source-status-smoke.mjs \
            v2/provenance-alias-smoke.mjs \
            v2/executive-dashboard-smoke.mjs \
            v2/cockpit-smoke.mjs \
            v2/product-finish-smoke.mjs \
            v2/upload-outcome-smoke.mjs \
            v2/mfp-water-import-smoke.mjs \
            v2/source-continuity-unknown-smoke.mjs; do
            bash v2/run-browser-gate.sh "$test_file"
          done
