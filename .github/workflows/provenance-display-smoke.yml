name: LTS Health v2 Provenance Display Smoke
on:
  push:
    branches: [architecture-v2]
    paths:
      - 'v2/src/data-screen.js'
      - 'v2/provenance-display-smoke.mjs'
      - '.github/workflows/provenance-display-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static provenance contract
        run: |
          node --check v2/src/data-screen.js
          node --check v2/provenance-display-smoke.mjs
          ! grep -q "canonical_status||'candidate'" v2/src/data-screen.js
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Provenance display desktop and mobile
        run: |
          python3 -m http.server 4173 --directory v2 >/tmp/lts-health-v2-http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node v2/provenance-display-smoke.mjs
