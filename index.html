<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="color-scheme" content="light">
  <title>LTS Health</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#12213a;background:#f4f7fb}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb}
    main{width:min(92vw,460px);padding:28px;border:1px solid #dfe6ef;border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(30,55,90,.08);text-align:center}
    .mark{width:44px;height:44px;margin:0 auto 14px;border-radius:13px;display:grid;place-items:center;background:#2766d9;color:#fff;font-weight:900}
    h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#68778e;font-size:13px;line-height:1.5}a{display:inline-block;margin-top:16px;color:#2766d9;font-weight:800;text-decoration:none}
  </style>
  <script>
    (()=>{
      const legacyRoutes={today:'hoje',timeline:'timeline',evolution:'evolucao',training:'treinos',health:'saude',nutrition:'nutricao',insights:'analise',inbox:'dados'};
      const raw=(location.hash||'').replace(/^#/,'').trim();
      const mapped=legacyRoutes[raw]||(['hoje','bio','treinos','analise','saude','tratamentos','evolucao','timeline','nutricao','dados','mais'].includes(raw)?raw:'');
      const target=`./v2/${location.search||''}${mapped?`#${mapped}`:''}`;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark">L</div>
    <h1>Abrindo LTS Health</h1>
    <p>Carregando o cockpit longitudinal de saúde.</p>
    <a href="./v2/">Abrir cockpit</a>
  </main>
</body>
</html>
