name: LTSHealthSync
options:
  bundleIdPrefix: com.ltshealth
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  LTSHealthSync:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/LTSHealthSync.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ltshealth.sync
        PRODUCT_NAME: LTS Health Sync
        CODE_SIGN_ENTITLEMENTS: Resources/LTSHealthSync.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
